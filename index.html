<style>
/* Una sola cara: sala arcade de noche (la del panel que ya se probó). Tablero de 3 momentos, un paso a la vez, botones grandes. */
:root{color-scheme:dark;--fondo:#070B18;--panel:#111A33;--panel2:#18234A;--borde:#2A3A6E;--txt:#E8F1FF;--txt2:#A9B8DA;

*{box-sizing:border-box}
body{margin:0;font-family:var(--cuerpo);font-size:17px;background:var(--fondo);color:var(--txt);

.n{font-family:var(--tit);font-variant-numeric:tabular-nums}
@keyframes holo{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes run{0%{transform:translateX(-60px)}100%{transform:translateX(calc(100vw + 60px))}}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;background:linear-gradient(90deg,#0B1230,#1A0B30);border-bottom:1px solid var(--borde)}

.arc .px{position:absolute;bottom:6px;left:0;width:39px;height:39px;animation:run 14s linear infinite}
